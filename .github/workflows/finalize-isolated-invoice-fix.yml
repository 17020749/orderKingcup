name: Finalize isolated legacy invoice fix

on:
  push:
    branches:
      - agent/fix-sale-edit-legacy-orders-v2
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip-finalize-invoice-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sale-edit-legacy-orders-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply client-only patch and extract regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          atomic = Path('utils/orderAtomicSave.mjs')
          text = atomic.read_text()
          helper = """// A missing invoice document cannot satisfy scoped read rules because
          // resource.data does not exist. Read only when the document must already
          // exist: a status update, or an explicit restore after a soft delete.
          export function shouldReadExistingInvoiceSnapshot({
            mode,
            invoiceMutation,
            persistedOrder = {},
          } = {}) {
            if (mode !== 'edit' || !invoiceMutation) return false
            if (invoiceMutation.mode === 'status_update') return true
            if (invoiceMutation.mode !== 'legacy_create') return false
            return String(persistedOrder.relation_last_module || '') === 'invoices'
              && String(persistedOrder.relation_last_action || '') === 'delete'
              && text(persistedOrder.relation_last_document_id) === text(invoiceMutation.invoiceId)
          }

          """
          marker = 'export function estimateAtomicOrderWrites({'
          if 'export function shouldReadExistingInvoiceSnapshot' not in text:
            assert text.count(marker) == 1
            atomic.write_text(text.replace(marker, helper + marker, 1))

          composable = Path('composables/useAtomicOrderSave.ts')
          text = composable.read_text()
          import_marker = '  resolveOrderOwnershipForSave,\n'
          if '  shouldReadExistingInvoiceSnapshot,\n' not in text:
            assert text.count(import_marker) == 1
            text = text.replace(import_marker, import_marker + '  shouldReadExistingInvoiceSnapshot,\n', 1)
          text, removed = re.subn(
            r"\n\s{6}const invoiceSnapshot = input\.mode === 'edit' && invoiceRef\n"
            r"\s{8}\? await transaction\.get\(invoiceRef\)\n"
            r"\s{8}: null\n",
            '\n', text, count=1,
          )
          if 'const invoiceSnapshot = invoiceRef && shouldReadExistingInvoiceSnapshot({' not in text:
            existing = "      const existingOrder = orderSnapshot?.exists() ? orderSnapshot.data() : {}\n"
            insertion = """      const existingOrder = orderSnapshot?.exists() ? orderSnapshot.data() : {}
              const invoiceSnapshot = invoiceRef && shouldReadExistingInvoiceSnapshot({
                mode: input.mode,
                invoiceMutation,
                persistedOrder: existingOrder,
              })
                ? await transaction.get(invoiceRef)
                : null
          """
            assert text.count(existing) == 1
            text = text.replace(existing, insertion, 1)
          composable.write_text(text)

          package = Path('package.json')
          text = package.read_text()
          new_test = 'tests/order-missing-invoice-transaction.rules.test.mjs'
          if new_test not in text:
            marker = 'tests/order-legacy-missing-identity.rules.test.mjs '
            assert text.count(marker) == 1
            package.write_text(text.replace(marker, marker + new_test + ' ', 1))

          workflow = Path('.github/workflows/fix-sale-missing-invoice-read-v2.yml').read_text().splitlines()
          def extract_test(path):
            marker = f"          cat > {path} <<'EOF'"
            start = workflow.index(marker) + 1
            end = workflow.index('          EOF', start)
            content = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end]) + '\n'
            Path(path).write_text(content)
          extract_test('tests/order-missing-invoice-read.client.test.mjs')
          extract_test('tests/order-missing-invoice-transaction.rules.test.mjs')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run isolated client regression
        run: node --test tests/order-missing-invoice-read.client.test.mjs

      - name: Run isolated Firestore regression
        run: npx firebase emulators:exec --only firestore "node --test --test-concurrency=1 tests/order-missing-invoice-transaction.rules.test.mjs"

      - name: Run full Firestore rules suite
        run: npm run test:rules

      - name: Build
        run: npm run build

      - name: Generate static site
        run: npm run generate

      - name: Commit verified fix and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-sale-missing-invoice-read.yml
          git rm -f .github/workflows/fix-sale-missing-invoice-read-v2.yml
          git rm -f .github/workflows/rewrite-isolated-invoice-workflow.yml
          git rm -f .github/workflows/finalize-isolated-invoice-fix.yml
          git add composables/useAtomicOrderSave.ts utils/orderAtomicSave.mjs package.json tests/order-missing-invoice-read.client.test.mjs tests/order-missing-invoice-transaction.rules.test.mjs
          git commit -m "fix: bỏ đọc hóa đơn chưa tồn tại khi sửa đơn legacy [skip-finalize-invoice-fix]"
          git push origin HEAD:agent/fix-sale-edit-legacy-orders-v2
