name: Apply external export release patch

on:
  push:
    branches:
      - agent/external-export-no-inventory

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source patch
        run: node scripts/apply-external-export-release-patch.mjs

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add external export release without inventory"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Run client regression test
        run: node --test tests/external-export-release.client.test.mjs

      - name: Run Firestore rules regression test
        run: npx firebase emulators:exec --only firestore "node --test --test-concurrency=1 tests/external-export-release.rules.test.mjs"
