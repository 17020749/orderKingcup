name: Cache and Permissions CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: cache-permissions-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify_cache_and_permissions:
    name: Cache and focused permission tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2 --no-audit --no-fund

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Query cache tests
        run: npm run test:cache

      - name: Focused permission tests
        run: npm run test:permissions
