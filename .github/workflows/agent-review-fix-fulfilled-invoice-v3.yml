name: Agent review fix fulfilled invoice v3

on:
  push:
    branches:
      - agent/fulfilled-order-invoice-edit

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.invalid
      NUXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder
      NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      NUXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
      NUXT_PUBLIC_APP_NAME: KINGCUP CI
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fulfilled-order-invoice-edit
          fetch-depth: 0
      - name: Apply review corrections
        run: python .github/agent-review-fix-fulfilled-invoice.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare Nuxt
        run: npx --no-install nuxi prepare
      - name: Client regression tests
        run: node --test tests/order-fulfilled-metadata-edit.client.test.mjs
      - name: Focused fulfilled rules regression
        run: npx firebase emulators:exec --only firestore --project demo-order-export-delete-lock "node --test tests/order-export-delete-lock.rules.test.mjs"
      - name: Full Firestore rules tests
        run: npm run test:rules
      - name: Build
        run: npm run build
      - name: Commit review corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/orders.vue firestore.rules tests/order-fulfilled-metadata-edit.client.test.mjs tests/order-export-delete-lock.rules.test.mjs
          git diff --cached --check
          git commit -m "test: tighten fulfilled invoice edit boundaries"
          git push origin HEAD:agent/fulfilled-order-invoice-edit
