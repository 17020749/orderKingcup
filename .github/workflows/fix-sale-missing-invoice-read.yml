name: Guarded legacy invoice read fix

on:
  push:
    branches:
      - agent/fix-sale-edit-legacy-orders-v2

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[skip-legacy-invoice-read-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sale-edit-legacy-orders-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              file.write_text(text.replace(old, new, 1))

          atomic = Path('utils/orderAtomicSave.mjs')
          atomic_text = atomic.read_text()
          helper = """
          // A missing invoice document cannot satisfy scoped read rules because
          // resource.data does not exist. Read only when the document must already
          // exist: a status update, or an explicit restore after a soft delete.
          export function shouldReadExistingInvoiceSnapshot({
            mode,
            invoiceMutation,
            persistedOrder = {},
          } = {}) {
            if (mode !== 'edit' || !invoiceMutation) return false
            if (invoiceMutation.mode === 'status_update') return true
            if (invoiceMutation.mode !== 'legacy_create') return false
            return String(persistedOrder.relation_last_module || '') === 'invoices'
              && String(persistedOrder.relation_last_action || '') === 'delete'
              && text(persistedOrder.relation_last_document_id) === text(invoiceMutation.invoiceId)
          }

          """
          marker = 'export function estimateAtomicOrderWrites({'
          if 'export function shouldReadExistingInvoiceSnapshot' in atomic_text:
              raise SystemExit('helper already exists unexpectedly')
          if atomic_text.count(marker) != 1:
              raise SystemExit('atomic helper insertion marker not found exactly once')
          atomic.write_text(atomic_text.replace(marker, helper + marker, 1))

          replace_once(
              'composables/useAtomicOrderSave.ts',
              '  resolveOrderOwnershipForSave,\n',
              '  resolveOrderOwnershipForSave,\n  shouldReadExistingInvoiceSnapshot,\n',
          )
          replace_once(
              'composables/useAtomicOrderSave.ts',
              """      const invoiceSnapshot = input.mode === 'edit' && invoiceRef
                ? await transaction.get(invoiceRef)
                : null

          """,
              '',
          )
          replace_once(
              'composables/useAtomicOrderSave.ts',
              """      const existingOrder = orderSnapshot?.exists() ? orderSnapshot.data() : {}
          """,
              """      const existingOrder = orderSnapshot?.exists() ? orderSnapshot.data() : {}
              const invoiceSnapshot = invoiceRef && shouldReadExistingInvoiceSnapshot({
                mode: input.mode,
                invoiceMutation,
                persistedOrder: existingOrder,
              })
                ? await transaction.get(invoiceRef)
                : null
          """,
          )

          replace_once(
              'tests/order-atomic-save.client.test.mjs',
              '  planAtomicOrderItems,\n',
              '  planAtomicOrderItems,\n  shouldReadExistingInvoiceSnapshot,\n',
          )
          replace_once(
              'tests/order-atomic-save.client.test.mjs',
              "test('chặn dòng sản phẩm thiếu ID hoặc trùng ID trước khi gọi Firestore', () => {\n",
              """test('legacy_create không đọc invoice chưa tồn tại nhưng vẫn đọc khi restore', () => {
            const invoiceMutation = { mode: 'legacy_create', invoiceId: 'inv_ord_legacy' }
            assert.equal(shouldReadExistingInvoiceSnapshot({
              mode: 'edit', invoiceMutation, persistedOrder: {},
            }), false)
            assert.equal(shouldReadExistingInvoiceSnapshot({
              mode: 'edit',
              invoiceMutation,
              persistedOrder: {
                invoice_record_count: 1,
                invoice_relation_revision: 9,
                relation_last_module: 'invoices',
                relation_last_action: 'create',
                relation_last_document_id: 'inv_ord_legacy',
              },
            }), false)
            assert.equal(shouldReadExistingInvoiceSnapshot({
              mode: 'edit',
              invoiceMutation,
              persistedOrder: {
                relation_last_module: 'invoices',
                relation_last_action: 'delete',
                relation_last_document_id: 'inv_ord_legacy',
              },
            }), true)
            assert.equal(shouldReadExistingInvoiceSnapshot({
              mode: 'edit',
              invoiceMutation: { mode: 'status_update', invoiceId: 'invoice-active' },
              persistedOrder: {},
            }), true)
          })

          test('chặn dòng sản phẩm thiếu ID hoặc trùng ID trước khi gọi Firestore', () => {
          """,
          )
          replace_once(
              'tests/order-atomic-save.client.test.mjs',
              '  assert.match(composable, /buildOrderItemLifecyclePatch\\(item\\.isNew\\)/)\n',
              """  assert.match(composable, /buildOrderItemLifecyclePatch\\(item\\.isNew\\)/)
            assert.match(composable, /shouldReadExistingInvoiceSnapshot\\(\\{/)
            assert.doesNotMatch(composable, /input\\.mode === 'edit' && invoiceRef[\\s\\S]{0,80}transaction\\.get\\(invoiceRef\\)/)
          """,
          )

          replace_once(
              'tests/order-legacy-missing-identity.rules.test.mjs',
              '  getDoc,\n  serverTimestamp,\n',
              '  getDoc,\n  runTransaction,\n  serverTimestamp,\n',
          )

          legacy_path = Path('tests/order-legacy-missing-identity.rules.test.mjs')
          legacy_text = legacy_path.read_text()
          marker = "\ntest('Sale direct get được order legacy theo tiền tố order_code nhưng Sale khác bị chặn', async () => {"
          addition = r'''

          function repairMissingInvoiceTransaction(db, actor, { readMissingInvoice = false } = {}) {
            return runTransaction(db, async transaction => {
              const orderRef = doc(db, 'orders', ORDER_ID)
              const itemRef = doc(db, 'order_items', ITEM_ID)
              const invoiceRef = doc(db, 'invoices', INVOICE_ID)
              const orderSnapshot = await transaction.get(orderRef)
              assert.equal(orderSnapshot.exists(), true)
              if (readMissingInvoice) await transaction.get(invoiceRef)

              const timestamp = serverTimestamp()
              const operationId = `transaction-repair-${ORDER_ID}`
              transaction.set(invoiceRef, {
                id: INVOICE_ID,
                order_id: ORDER_ID,
                order_code: 'SALE01-ABC001-0001',
                invoice_number: '',
                invoice_date: '',
                invoice_amount: 150000,
                invoice_status: 'Không xuất',
                tax_code: '',
                company_name: '',
                billing_address: '',
                note: '',
                created_by: actor,
                order_owner_email: '',
                order_created_by: '',
                order_sale_email: '',
                relation_revision: 1,
                last_operation_id: operationId,
                active: true,
                deleted: false,
                status: 'active',
                created_at: timestamp,
                updated_at: timestamp,
              })
              transaction.update(orderRef, {
                note: 'Sale sửa đơn legacy bằng transaction',
                invoice_status: 'Không xuất',
                invoice_record_count: 1,
                invoice_relation_revision: 1,
                relation_lock_version: 1,
                relation_last_module: 'invoices',
                relation_last_action: 'create',
                relation_last_document_id: INVOICE_ID,
                relation_updated_by: actor,
                relation_updated_at: timestamp,
                revision: 1,
                last_operation_id: operationId,
                updated_at: timestamp,
              })
              transaction.update(itemRef, {
                product_name: 'Sản phẩm dữ liệu cũ đã sửa bằng transaction',
                owner_email: '',
                created_by: '',
                sale_email: '',
                order_revision: 1,
                last_operation_id: operationId,
                updated_at: timestamp,
              })
            })
          }

          test('đọc invoice deterministic chưa tồn tại trong transaction bị Rules từ chối', async () => {
            const db = env.authenticatedContext(SALE, { email: SALE }).firestore()
            await assertFails(repairMissingInvoiceTransaction(db, SALE, { readMissingInvoice: true }))
          })

          test('bỏ đọc invoice chưa tồn tại thì Sale tạo invoice và sửa order legacy atomically', async () => {
            const db = env.authenticatedContext(SALE, { email: SALE }).firestore()
            await assertSucceeds(repairMissingInvoiceTransaction(db, SALE))
            const order = (await getDoc(doc(db, 'orders', ORDER_ID))).data()
            const invoice = (await getDoc(doc(db, 'invoices', INVOICE_ID))).data()
            assert.equal(order.revision, 1)
            assert.equal(invoice.order_id, ORDER_ID)
            assert.equal(invoice.created_by, SALE)
          })
          '''
          if marker not in legacy_text:
              raise SystemExit('legacy test insertion marker not found')
          legacy_path.write_text(legacy_text.replace(marker, addition + marker, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused client regression
        run: node --test tests/order-atomic-save.client.test.mjs

      - name: Run focused Firestore regression
        run: firebase emulators:exec --only firestore "node --test --test-concurrency=1 tests/order-legacy-missing-identity.rules.test.mjs"

      - name: Run full Firestore rules suite
        run: npm run test:rules

      - name: Build
        run: npm run build

      - name: Generate static site
        run: npm run generate

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-sale-missing-invoice-read.yml
          git add utils/orderAtomicSave.mjs composables/useAtomicOrderSave.ts tests/order-atomic-save.client.test.mjs tests/order-legacy-missing-identity.rules.test.mjs
          git commit -m "fix: bỏ đọc hóa đơn chưa tồn tại khi sửa đơn legacy [skip-legacy-invoice-read-fix]"
          git push origin HEAD:agent/fix-sale-edit-legacy-orders-v2
