name: Diagnose external export record

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - agent/external-export-record

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'agent/external-export-record')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/external-export-record
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run focused diagnostics
        shell: bash
        run: |
          set +e
          echo '=== CLIENT TEST ===' > diagnostic-external-export.log
          node --test tests/external-export-release.client.test.mjs >> diagnostic-external-export.log 2>&1
          client_status=$?
          echo "CLIENT_EXIT=$client_status" >> diagnostic-external-export.log
          echo >> diagnostic-external-export.log
          echo '=== RULES TEST ===' >> diagnostic-external-export.log
          npx --no-install firebase emulators:exec --only firestore "node --test tests/external-export-release.rules.test.mjs" >> diagnostic-external-export.log 2>&1
          rules_status=$?
          echo "RULES_EXIT=$rules_status" >> diagnostic-external-export.log
          test_status=$(( client_status != 0 || rules_status != 0 ))
          echo "DIAGNOSTIC_EXIT=$test_status" >> diagnostic-external-export.log
          tail -n 300 diagnostic-external-export.log
          exit 0

      - name: Commit diagnostic log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic-external-export.log
          git commit -m "Capture external export diagnostic log"
          git push origin HEAD:agent/external-export-record
