name: Cleanup Order Invoice Build Artifacts

on:
  push:
    branches:
      - agent/order-invoice-atomic-flow
    paths:
      - '.github/workflows/cleanup-order-invoice-artifacts.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'chore: clean generated build artifacts') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/order-invoice-atomic-flow
          fetch-depth: 0

      - name: Restore generated paths from dev
        run: |
          git fetch origin dev
          git rm -r -f --ignore-unmatch .nuxt .output
          git checkout origin/dev -- .nuxt 2>/dev/null || true
          git checkout origin/dev -- .output 2>/dev/null || true
          git clean -fdx .nuxt .output
          rm -rf .agent-order-invoice
          rm -f .github/workflows/cleanup-order-invoice-artifacts.yml

          if [ -n "$(git diff --name-only origin/dev -- .nuxt .output)" ]; then
            echo 'Generated paths still differ from dev:'
            git diff --name-only origin/dev -- .nuxt .output
            exit 1
          fi

      - name: Commit clean feature tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: clean generated build artifacts'
          git push origin HEAD:agent/order-invoice-atomic-flow
