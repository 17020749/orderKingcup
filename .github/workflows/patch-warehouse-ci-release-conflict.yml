name: Patch Warehouse CI Release Conflict

on:
  push:
    branches:
      - feat/edit-fulfilled-order-metadata

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/edit-fulfilled-order-metadata
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch workflow
        run: node scripts/patch-warehouse-ci-release-conflict.mjs

      - name: Commit final workflow only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-warehouse-ci-release-conflict.yml scripts/patch-warehouse-ci-release-conflict.mjs
          git add .github/workflows/warehouse-ci.yml
          git commit -m "ci: serialize Firebase Rules deployments"
          git push origin HEAD:feat/edit-fulfilled-order-metadata
