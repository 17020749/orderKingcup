name: Diagnose transport rules

on:
  push:
    branches:
      - agent/transport-info-catalog
    paths:
      - .github/workflows/diagnose-transport-rules.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transport-info-catalog
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global npm@10.9.2 --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture concise failure
        shell: bash
        run: |
          rm -f TRANSPORT_RULES_ERROR.txt
          set +e
          npm run test:rules > /tmp/rules.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "All rules tests passed." > TRANSPORT_RULES_ERROR.txt
          else
            {
              grep -n -B 15 -A 40 -E 'not ok|AssertionError|SyntaxError|Error:' /tmp/rules.log || true
              echo '=== TAIL ==='
              tail -n 180 /tmp/rules.log
            } > TRANSPORT_RULES_ERROR.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TRANSPORT_RULES_ERROR.txt
          git commit -m "Record transport rules diagnostic"
          git push origin HEAD:agent/transport-info-catalog
          exit "$status"
