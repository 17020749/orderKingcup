name: Run VAT and printing row fix

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  validate-script:
    if: github.head_ref == 'agent/fix-import-vat-and-printing-rows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-import-vat-and-printing-rows

      - name: Validate patch script syntax
        run: python -m py_compile .github/scripts/apply_fix_import_vat_printing_rows.py
