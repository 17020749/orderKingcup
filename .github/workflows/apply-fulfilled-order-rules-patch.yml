name: Apply fulfilled order rules patch

on:
  push:
    branches:
      - feat/edit-fulfilled-order-metadata

permissions:
  contents: write

jobs:
  patch-rules:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/edit-fulfilled-order-metadata
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply rules patch
        run: node scripts/apply-fulfilled-order-rules-patch.mjs

      - name: Commit patched rules
        run: |
          if git diff --quiet -- firestore.rules; then
            echo "Rules already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git commit -m "feat: allow limited edits for fulfilled orders"
          git push origin HEAD:feat/edit-fulfilled-order-metadata
