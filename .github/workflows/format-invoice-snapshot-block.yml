name: Format conditional invoice snapshot block

on:
  push:
    branches:
      - agent/fix-sale-edit-legacy-orders-v2
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip-format-invoice-block]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sale-edit-legacy-orders-v2
          fetch-depth: 0
      - name: Format and verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('composables/useAtomicOrderSave.ts')
          text = path.read_text()
          old = """    const invoiceSnapshot = invoiceRef && shouldReadExistingInvoiceSnapshot({
            mode: input.mode,
            invoiceMutation,
            persistedOrder: existingOrder,
          })
            ? await transaction.get(invoiceRef)
            : null
          """
          new = """      const invoiceSnapshot = invoiceRef && shouldReadExistingInvoiceSnapshot({
                mode: input.mode,
                invoiceMutation,
                persistedOrder: existingOrder,
              })
                ? await transaction.get(invoiceRef)
                : null
          """
          if text.count(old) != 1:
            raise SystemExit(f'expected one block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          node --test tests/order-missing-invoice-read.client.test.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-invoice-snapshot-block.yml
          git add composables/useAtomicOrderSave.ts
          git commit -m "style: căn lề block đọc hóa đơn có điều kiện [skip-format-invoice-block]"
          git push origin HEAD:agent/fix-sale-edit-legacy-orders-v2
