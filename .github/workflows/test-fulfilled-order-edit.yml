name: Test fulfilled order edit

on:
  push:
    branches:
      - feat/edit-fulfilled-order-metadata

permissions:
  contents: read

jobs:
  client-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/edit-fulfilled-order-metadata
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:fulfilled-order-edit
