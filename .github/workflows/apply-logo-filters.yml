name: Apply logo filters

on:
  push:
    branches:
      - agent/logo-filters

permissions:
  contents: write

concurrency:
  group: apply-logo-filters-agent-logo-filters
  cancel-in-progress: false

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/logo-filters
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source changes
        run: python3 scripts/apply-logo-filters.py

      - name: Install dependencies
        run: npm ci

      - name: Run logo filter tests
        run: node --test tests/logo-filter.client.test.mjs

      - name: Build application
        run: npm run build

      - name: Commit changes and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-logo-filters.yml scripts/apply-logo-filters.py
          git add pages/orders.vue pages/export-requests.vue pages/imports.vue pages/warehouse-export-requests.vue pages/exports.vue utils/logoFilter.mjs tests/logo-filter.client.test.mjs
          git commit -m "Add logo filters to document pages"
          git push origin HEAD:agent/logo-filters
