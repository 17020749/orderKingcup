name: Agent apply fulfilled invoice edit v2

on:
  push:
    branches:
      - agent/fulfilled-order-invoice-edit

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.invalid
      NUXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder
      NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      NUXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
      NUXT_PUBLIC_APP_NAME: KINGCUP CI

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fulfilled-order-invoice-edit
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2 --no-audit --no-fund

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply corrected scoped patch
        shell: bash
        run: |
          cat .github/agent-fulfilled-invoice-v2.part1 .github/agent-fulfilled-invoice-v2.part2 .github/agent-fulfilled-invoice-v2.part3 .github/agent-fulfilled-invoice-v2.part4 > /tmp/apply-fulfilled-invoice.py.gz.b64
          echo 'af247ca73e15a4049f97e59a4f7482e9ab5f2ffa21cf4bfe9f9cf95a145b7bee  /tmp/apply-fulfilled-invoice.py.gz.b64' | sha256sum --check
          base64 -d /tmp/apply-fulfilled-invoice.py.gz.b64 | gzip -d > /tmp/apply-fulfilled-invoice.py
          python -m py_compile /tmp/apply-fulfilled-invoice.py
          python /tmp/apply-fulfilled-invoice.py

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare Nuxt
        run: npx --no-install nuxi prepare

      - name: Client regression tests
        run: node --test tests/order-fulfilled-metadata-edit.client.test.mjs

      - name: Firestore rules tests
        run: npm run test:rules

      - name: Build
        run: npm run build

      - name: Commit implementation and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-apply-fulfilled-invoice.yml .github/workflows/agent-apply-fulfilled-invoice-v2.yml .github/agent-apply-fulfilled-invoice.py.gz.b64 .github/agent-fulfilled-invoice.part1 .github/agent-fulfilled-invoice.part2 .github/agent-fulfilled-invoice.part3 .github/agent-fulfilled-invoice.part4 .github/agent-fulfilled-invoice-v2.part1 .github/agent-fulfilled-invoice-v2.part2 .github/agent-fulfilled-invoice-v2.part3 .github/agent-fulfilled-invoice-v2.part4
          git add pages/orders.vue composables/useFulfilledOrderMetadataSave.ts utils/orderFulfilledMetadataEdit.mjs firestore.rules tests/order-fulfilled-metadata-edit.client.test.mjs tests/order-export-delete-lock.rules.test.mjs
          git diff --cached --check
          git commit -m "feat: allow invoice status edit on fulfilled orders"
          git push origin HEAD:agent/fulfilled-order-invoice-edit
