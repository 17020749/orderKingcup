name: Harden PR 193 external manifest binding

on:
  push:
    branches:
      - codex/finalize-and-complete-warehouse-changes

permissions:
  contents: write

jobs:
  harden-manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/finalize-and-complete-warehouse-changes
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply manifest hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          rules_path = Path('firestore.rules')
          rules = rules_path.read_text()
          old = """          && existsAfter(exportOrderItemPath(manifestIds[index]))
          );"""
          new = """          && existsAfter(exportOrderItemPath(manifestIds[index]))
          && getAfter(exportOrderItemPath(manifestIds[index])).data.get('created_at', null) == request.time
          );"""
          rules = replace_once(rules, old, new, 'external manifest transaction binding')
          rules_path.write_text(rules)

          test_path = Path('tests/external-export-release.rules.test.mjs')
          tests = test_path.read_text()
          marker = "test('external release modern matches product and quantity from the request snapshot', async () => {"
          regression = """test('external export header cannot reuse a pre-existing manifest item outside the release transaction', async () => {
            await env.withSecurityRulesDisabled(async context => {
              await setDoc(doc(context.firestore(), 'export_order_items', 'external-item-a'), externalExportItem({
                created_at: Timestamp.fromMillis(1),
                updated_at: Timestamp.fromMillis(1),
              }))
            })
            const db = env.authenticatedContext(WAREHOUSE, { email: WAREHOUSE }).firestore()
            await assertFails(setDoc(doc(db, 'export_orders', EXPORT_ID), externalExportOrder()))
          })

          """.replace('          ', '')
          if tests.count(marker) != 1:
              raise SystemExit('manifest regression insertion marker not found exactly once')
          if 'external export header cannot reuse a pre-existing manifest item outside the release transaction' not in tests:
              tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused warehouse lifecycle tests
        run: npm run test:warehouse-lifecycle

      - name: Commit hardened Rules and regression test
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harden-pr193-manifest.yml
          git add firestore.rules tests/external-export-release.rules.test.mjs
          git diff --cached --check
          git commit -m "harden external manifest transaction binding"
          git push origin HEAD:codex/finalize-and-complete-warehouse-changes
