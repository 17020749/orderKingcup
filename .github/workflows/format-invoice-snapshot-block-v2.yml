name: Format invoice snapshot block v2

on:
  push:
    branches:
      - agent/fix-sale-edit-legacy-orders-v2
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip-format-invoice-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sale-edit-legacy-orders-v2
          fetch-depth: 0
      - name: Format and verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('composables/useAtomicOrderSave.ts')
          text = path.read_text()
          pattern = re.compile(
            r"\n\s*const invoiceSnapshot = invoiceRef && shouldReadExistingInvoiceSnapshot\(\{\n"
            r"\s*mode: input\.mode,\n"
            r"\s*invoiceMutation,\n"
            r"\s*persistedOrder: existingOrder,\n"
            r"\s*\}\)\n"
            r"\s*\? await transaction\.get\(invoiceRef\)\n"
            r"\s*: null\n"
          )
          replacement = (
            "\n      const invoiceSnapshot = invoiceRef && shouldReadExistingInvoiceSnapshot({\n"
            "        mode: input.mode,\n"
            "        invoiceMutation,\n"
            "        persistedOrder: existingOrder,\n"
            "      })\n"
            "        ? await transaction.get(invoiceRef)\n"
            "        : null\n"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            raise SystemExit(f'expected one invoice snapshot block, found {count}')
          path.write_text(text)
          PY
          node --test tests/order-missing-invoice-read.client.test.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/format-invoice-snapshot-block.yml
          git rm -f --ignore-unmatch .github/workflows/format-invoice-snapshot-block-v2.yml
          git add composables/useAtomicOrderSave.ts
          git commit -m "style: căn lề block đọc hóa đơn có điều kiện [skip-format-invoice-v2]"
          git push origin HEAD:agent/fix-sale-edit-legacy-orders-v2
