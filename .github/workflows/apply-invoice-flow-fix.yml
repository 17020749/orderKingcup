name: Apply Invoice Flow Fix

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.agent-invoice-flow-fix/trigger'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fix-legacy-invoice-create-and-accounting-scope'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NUXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.invalid
      NUXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder
      NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      NUXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
      NUXT_PUBLIC_APP_NAME: KINGCUP CI

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-legacy-invoice-create-and-accounting-scope
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2 --no-audit --no-fund

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply core invoice patch
        run: node .agent-invoice-flow-fix/patch.mjs

      - name: Optimize invoice Rules dispatch
        run: node .agent-invoice-flow-fix/optimize-rules.mjs

      - name: Align invoice regression tests
        run: node .agent-invoice-flow-fix/update-regression-tests.mjs

      - name: Finalize invoice safeguards
        run: node .agent-invoice-flow-fix/finalize-patch.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare Nuxt
        run: npx --no-install nuxi prepare

      - name: Run focused client regression tests
        run: >-
          node --test --test-concurrency=1
          tests/invoice-order-repair-permissions.client.test.mjs
          tests/order-invoice-legacy-backfill.client.test.mjs
          tests/order-permission-scope-regression.client.test.mjs
          tests/order-invoice-post-merge.client.test.mjs

      - name: Capture focused Firestore Rules tests
        id: focused_rules
        shell: bash
        run: |
          set +e
          npx --no-install firebase emulators:exec --only firestore \
            "node --test --test-concurrency=1 \
            tests/invoice-order-repair-permissions.rules.test.mjs \
            tests/order-invoice-legacy-backfill.rules.test.mjs \
            tests/order-invoice-flow.rules.test.mjs \
            tests/order-relations.rules.test.mjs \
            tests/unified-permission-matrix.rules.test.mjs" \
            > focused-rules.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload focused Rules log
        uses: actions/upload-artifact@v4
        with:
          name: focused-rules-log
          path: focused-rules.log
          if-no-files-found: error

      - name: Stop on focused Rules failure
        if: steps.focused_rules.outputs.status != '0'
        run: exit 1

      - name: Capture full Firestore Rules tests
        id: full_rules
        shell: bash
        run: |
          set +e
          npm run test:rules > full-rules.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload full Rules log
        uses: actions/upload-artifact@v4
        with:
          name: full-rules-log
          path: full-rules.log
          if-no-files-found: error

      - name: Stop on full Rules failure
        if: steps.full_rules.outputs.status != '0'
        run: exit 1

      - name: Build application
        run: npm run build

      - name: Generate static site
        run: npm run generate

      - name: Remove bootstrap and generated files
        run: |
          git fetch origin dev
          git rm -r -f --ignore-unmatch .nuxt .output
          git checkout origin/dev -- .nuxt 2>/dev/null || true
          git checkout origin/dev -- .output 2>/dev/null || true
          git clean -fdx .nuxt .output
          rm -rf .agent-invoice-flow-fix .github/workflows/apply-invoice-flow-fix.yml

      - name: Commit verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: repair missing order invoices and lock accounting scope'
          git push origin HEAD:agent/fix-legacy-invoice-create-and-accounting-scope

  report-rules:
    needs: apply-and-verify
    if: always() && needs.apply-and-verify.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Download focused Rules log
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: focused-rules-log
      - name: Download full Rules log
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: full-rules-log
      - name: Print Rules failure
        run: |
          if [ -f full-rules.log ]; then
            tail -n 260 full-rules.log
          elif [ -f focused-rules.log ]; then
            tail -n 220 focused-rules.log
          else
            echo 'No Rules log artifact was produced.'
          fi
