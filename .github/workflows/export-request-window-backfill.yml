name: Export Request Window Backfill

on:
  workflow_dispatch:
    inputs:
      target:
        description: Firebase target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      mode:
        description: Run a dry-run report or apply the backfill
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirm_project_id:
        description: Type the exact Firebase project ID for the selected target
        required: true
        type: string
      limit:
        description: Optional maximum number of requests to inspect; leave blank for all
        required: false
        type: string

permissions:
  contents: read

jobs:
  backfill:
    name: ${{ inputs.mode }} export request window on ${{ inputs.target }}
    if: >-
      (inputs.target == 'staging' && github.ref == 'refs/heads/dev') ||
      (inputs.target == 'production' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.target == 'production' && 'production' || 'dev' }}
    env:
      EXPECTED_FIREBASE_PROJECT_ID: ${{ inputs.target == 'production' && 'orderfirestore-501909' || 'kingcupmanagerstaging' }}
      BACKFILL_MODE: ${{ inputs.mode }}
      BACKFILL_LIMIT: ${{ inputs.limit }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - name: Validate project confirmation
        shell: bash
        env:
          CONFIRMED_PROJECT_ID: ${{ inputs.confirm_project_id }}
        run: |
          if [[ "$CONFIRMED_PROJECT_ID" != "$EXPECTED_FIREBASE_PROJECT_ID" ]]; then
            echo "::error::Project confirmation mismatch. Expected exactly: $EXPECTED_FIREBASE_PROJECT_ID"
            exit 1
          fi

      - name: Validate migration service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node <<'NODE'
          let serviceAccount
          try {
            serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || '')
          } catch {
            console.error('::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON')
            process.exit(1)
          }
          if (serviceAccount.project_id !== process.env.EXPECTED_FIREBASE_PROJECT_ID) {
            console.error(
              `::error::Service account belongs to ${serviceAccount.project_id || 'unknown'}; ` +
              `expected ${process.env.EXPECTED_FIREBASE_PROJECT_ID}`
            )
            process.exit(1)
          }
          NODE

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Run export request window backfill
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          args=("--project=$EXPECTED_FIREBASE_PROJECT_ID")
          if [[ -n "$BACKFILL_LIMIT" ]]; then
            args+=("--limit=$BACKFILL_LIMIT")
          fi
          if [[ "$BACKFILL_MODE" == "apply" ]]; then
            args+=(--apply "--confirm-project=$EXPECTED_FIREBASE_PROJECT_ID")
          fi
          node scripts/backfill-export-request-window.mjs "${args[@]}"
