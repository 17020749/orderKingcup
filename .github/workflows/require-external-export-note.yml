name: Require external export note

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'agent/external-export-record'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/external-export-record
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply patch
        run: node scripts/require-external-export-note.mjs

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require a note for external export records"
          git push origin HEAD:agent/external-export-record

      - name: Install dependencies
        run: npm ci

      - name: Run client test
        run: node --test tests/external-export-release.client.test.mjs

      - name: Run Firestore rules test
        run: npx --no-install firebase emulators:exec --only firestore "node --test tests/external-export-release.rules.test.mjs"

      - name: Build application
        run: npm run build
