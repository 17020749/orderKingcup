name: Fix external export order summary rule

on:
  push:
    branches:
      - agent/external-export-record

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/external-export-record
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply rule fix
        run: node scripts/fix-external-export-order-summary-rule.mjs

      - name: Commit rule fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix external export order summary rule"
          git push origin HEAD:agent/external-export-record

      - name: Install dependencies
        run: npm ci

      - name: Run client regression test
        run: node --test tests/external-export-release.client.test.mjs

      - name: Run Firestore rules regression test
        run: npx --no-install firebase emulators:exec --only firestore "node --test tests/external-export-release.rules.test.mjs"

      - name: Build application
        run: npm run build
