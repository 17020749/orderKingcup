name: Correct isolated emulator command

on:
  push:
    branches:
      - agent/fix-sale-edit-legacy-orders-v2
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  rewrite:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip-workflow-rewriter]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sale-edit-legacy-orders-v2
          fetch-depth: 0
      - name: Correct command and remove rewriter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/fix-sale-missing-invoice-read-v2.yml')
          text = path.read_text()
          old = 'run: firebase emulators:exec --only firestore'
          new = 'run: npx firebase emulators:exec --only firestore'
          if text.count(old) != 1:
            raise SystemExit(f'expected one emulator command, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rewrite-isolated-invoice-workflow.yml
          git add .github/workflows/fix-sale-missing-invoice-read-v2.yml
          git commit -m "chore: run isolated emulator through npx [skip-workflow-rewriter]"
          git push origin HEAD:agent/fix-sale-edit-legacy-orders-v2
