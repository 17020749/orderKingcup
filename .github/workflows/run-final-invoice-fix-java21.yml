name: Verify isolated invoice fix with Java 21

on:
  push:
    branches:
      - agent/fix-sale-edit-legacy-orders-v2
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip-java21-invoice-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sale-edit-legacy-orders-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply the prepared client-only patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/finalize-isolated-invoice-fix.yml').read_text().splitlines()
          start = lines.index("          python3 - <<'PY'") + 1
          end = lines.index('          PY', start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end]) + '\n'
          Path('/tmp/apply_invoice_fix.py').write_text(script)
          PY
          python3 /tmp/apply_invoice_fix.py
      - run: npm ci
      - name: Run isolated client regression
        run: node --test tests/order-missing-invoice-read.client.test.mjs
      - name: Run isolated Firestore regression
        run: npx firebase emulators:exec --only firestore "node --test --test-concurrency=1 tests/order-missing-invoice-transaction.rules.test.mjs"
      - name: Run full Firestore rules suite
        run: npm run test:rules
      - name: Build
        run: npm run build
      - name: Generate static site
        run: npm run generate
      - name: Commit verified fix and clean temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-sale-missing-invoice-read.yml
          git rm -f .github/workflows/fix-sale-missing-invoice-read-v2.yml
          git rm -f .github/workflows/rewrite-isolated-invoice-workflow.yml
          git rm -f .github/workflows/finalize-isolated-invoice-fix.yml
          git rm -f .github/workflows/debug-isolated-invoice-test.yml
          git rm -f .github/workflows/run-final-invoice-fix-java21.yml
          git add composables/useAtomicOrderSave.ts utils/orderAtomicSave.mjs package.json tests/order-missing-invoice-read.client.test.mjs tests/order-missing-invoice-transaction.rules.test.mjs
          git commit -m "fix: bỏ đọc hóa đơn chưa tồn tại khi sửa đơn legacy [skip-java21-invoice-fix]"
          git push origin HEAD:agent/fix-sale-edit-legacy-orders-v2
