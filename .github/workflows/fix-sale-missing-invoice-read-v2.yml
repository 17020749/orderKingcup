name: Isolated legacy invoice read fix

on:
  push:
    branches:
      - agent/fix-sale-edit-legacy-orders-v2
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip-isolated-invoice-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sale-edit-legacy-orders-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch client only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          atomic = Path('utils/orderAtomicSave.mjs')
          text = atomic.read_text()
          marker = 'export function estimateAtomicOrderWrites({'
          helper = """// A missing invoice document cannot satisfy scoped read rules because
          // resource.data does not exist. Read only when the document must already
          // exist: a status update, or an explicit restore after a soft delete.
          export function shouldReadExistingInvoiceSnapshot({
            mode,
            invoiceMutation,
            persistedOrder = {},
          } = {}) {
            if (mode !== 'edit' || !invoiceMutation) return false
            if (invoiceMutation.mode === 'status_update') return true
            if (invoiceMutation.mode !== 'legacy_create') return false
            return String(persistedOrder.relation_last_module || '') === 'invoices'
              && String(persistedOrder.relation_last_action || '') === 'delete'
              && text(persistedOrder.relation_last_document_id) === text(invoiceMutation.invoiceId)
          }

          """
          if 'export function shouldReadExistingInvoiceSnapshot' not in text:
            if text.count(marker) != 1:
              raise SystemExit('utility insertion marker mismatch')
            text = text.replace(marker, helper + marker, 1)
            atomic.write_text(text)

          composable = Path('composables/useAtomicOrderSave.ts')
          text = composable.read_text()
          if '  shouldReadExistingInvoiceSnapshot,\n' not in text:
            marker = '  resolveOrderOwnershipForSave,\n'
            if text.count(marker) != 1:
              raise SystemExit('composable import marker mismatch')
            text = text.replace(marker, marker + '  shouldReadExistingInvoiceSnapshot,\n', 1)

          pattern = re.compile(
            r"\n\s{6}const invoiceSnapshot = input\.mode === 'edit' && invoiceRef\n"
            r"\s{8}\? await transaction\.get\(invoiceRef\)\n"
            r"\s{8}: null\n"
          )
          text, removed = pattern.subn('\n', text, count=1)
          if removed != 1 and 'shouldReadExistingInvoiceSnapshot({' not in text:
            raise SystemExit(f'unconditional invoice read block mismatch: {removed}')

          insertion = """      const existingOrder = orderSnapshot?.exists() ? orderSnapshot.data() : {}
              const invoiceSnapshot = invoiceRef && shouldReadExistingInvoiceSnapshot({
                mode: input.mode,
                invoiceMutation,
                persistedOrder: existingOrder,
              })
                ? await transaction.get(invoiceRef)
                : null
          """
          existing = "      const existingOrder = orderSnapshot?.exists() ? orderSnapshot.data() : {}\n"
          if 'const invoiceSnapshot = invoiceRef && shouldReadExistingInvoiceSnapshot({' not in text:
            if text.count(existing) != 1:
              raise SystemExit('existing order insertion marker mismatch')
            text = text.replace(existing, insertion, 1)
          composable.write_text(text)

          package = Path('package.json')
          text = package.read_text()
          new_test = 'tests/order-missing-invoice-transaction.rules.test.mjs'
          if new_test not in text:
            marker = 'tests/order-legacy-missing-identity.rules.test.mjs '
            if text.count(marker) != 1:
              raise SystemExit('package test marker mismatch')
            text = text.replace(marker, marker + new_test + ' ', 1)
            package.write_text(text)
          PY

      - name: Add isolated regressions
        shell: bash
        run: |
          cat > tests/order-missing-invoice-read.client.test.mjs <<'EOF'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { test } from 'node:test'
          import { shouldReadExistingInvoiceSnapshot } from '../utils/orderAtomicSave.mjs'

          test('untouched legacy order does not read a missing deterministic invoice', () => {
            const mutation = { mode: 'legacy_create', invoiceId: 'inv_order-legacy' }
            assert.equal(shouldReadExistingInvoiceSnapshot({
              mode: 'edit',
              invoiceMutation: mutation,
              persistedOrder: {},
            }), false)
            assert.equal(shouldReadExistingInvoiceSnapshot({
              mode: 'edit',
              invoiceMutation: mutation,
              persistedOrder: {
                invoice_record_count: 1,
                invoice_relation_revision: 7,
                relation_last_module: 'invoices',
                relation_last_action: 'create',
                relation_last_document_id: 'inv_order-legacy',
              },
            }), false)
          })

          test('existing invoice is still read for status update and soft-delete restore', () => {
            assert.equal(shouldReadExistingInvoiceSnapshot({
              mode: 'edit',
              invoiceMutation: { mode: 'status_update', invoiceId: 'invoice-active' },
            }), true)
            assert.equal(shouldReadExistingInvoiceSnapshot({
              mode: 'edit',
              invoiceMutation: { mode: 'legacy_create', invoiceId: 'inv_order-legacy' },
              persistedOrder: {
                relation_last_module: 'invoices',
                relation_last_action: 'delete',
                relation_last_document_id: 'inv_order-legacy',
              },
            }), true)
          })

          test('runtime no longer reads every edit invoice before knowing whether it exists', () => {
            const source = readFileSync('composables/useAtomicOrderSave.ts', 'utf8')
            assert.match(source, /shouldReadExistingInvoiceSnapshot\(\{/)
            assert.doesNotMatch(
              source,
              /const invoiceSnapshot = input\.mode === 'edit' && invoiceRef[\s\S]{0,100}transaction\.get\(invoiceRef\)/,
            )
          })
          EOF

          cat > tests/order-missing-invoice-transaction.rules.test.mjs <<'EOF'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { after, before, beforeEach, test } from 'node:test'
          import {
            assertFails,
            assertSucceeds,
            initializeTestEnvironment,
          } from '@firebase/rules-unit-testing'
          import {
            doc,
            getDoc,
            runTransaction,
            serverTimestamp,
            setDoc,
          } from 'firebase/firestore'

          const projectId = 'demo-orderkingcup-missing-invoice-read'
          const SALE = 'hieunt051999@gmail.com'
          const ORDER_ID = 'ord_1784691728437_2c2195192150'
          const ITEM_ID = 'item_raw_legacy_1'
          const INVOICE_ID = `inv_${ORDER_ID}`
          let env

          before(async () => {
            env = await initializeTestEnvironment({
              projectId,
              firestore: { rules: readFileSync('firestore.rules', 'utf8') },
            })
          })

          beforeEach(async () => {
            await env.clearFirestore()
            await env.withSecurityRulesDisabled(async context => {
              const db = context.firestore()
              await Promise.all([
                setDoc(doc(db, 'users', SALE), {
                  email: SALE,
                  user_code: 'SALE01',
                  active: true,
                  deleted: false,
                  permissions_flat: [
                    'page.orders', 'orders.view', 'orders.edit',
                    'invoices.view', 'invoices.create', 'invoices.edit',
                  ],
                }),
                setDoc(doc(db, 'orders', ORDER_ID), {
                  id: ORDER_ID,
                  order_code: 'SALE01-ABC001-0001',
                  customer_id: 'customer-legacy',
                  customer_name: 'Khách legacy',
                  owner_email: '',
                  created_by: '',
                  sale_email: '',
                  warehouse_fulfillment_status: 'chua_xuat',
                  payable_amount: 150000,
                  actual_revenue: 150000,
                  invoice_status: 'Không xuất',
                  active: true,
                  deleted: false,
                  status: 'active',
                }),
                setDoc(doc(db, 'order_items', ITEM_ID), {
                  id: ITEM_ID,
                  order_id: ORDER_ID,
                  order_code: 'SALE01-ABC001-0001',
                  product_id: 'product-legacy',
                  product_code: 'SP-LEGACY',
                  product_name: 'Sản phẩm dữ liệu cũ',
                  quantity: 10,
                  unit_price: 15000,
                }),
              ])
            })
          })

          after(async () => env.cleanup())

          function saveLegacyOrder(db, { readMissingInvoice }) {
            return runTransaction(db, async transaction => {
              const orderRef = doc(db, 'orders', ORDER_ID)
              const itemRef = doc(db, 'order_items', ITEM_ID)
              const invoiceRef = doc(db, 'invoices', INVOICE_ID)
              const orderSnapshot = await transaction.get(orderRef)
              assert.equal(orderSnapshot.exists(), true)
              if (readMissingInvoice) await transaction.get(invoiceRef)

              const timestamp = serverTimestamp()
              const operationId = `repair-${ORDER_ID}`
              transaction.set(invoiceRef, {
                id: INVOICE_ID,
                order_id: ORDER_ID,
                order_code: 'SALE01-ABC001-0001',
                invoice_number: '',
                invoice_date: '',
                invoice_amount: 150000,
                invoice_status: 'Không xuất',
                tax_code: '',
                company_name: '',
                billing_address: '',
                note: '',
                created_by: SALE,
                order_owner_email: '',
                order_created_by: '',
                order_sale_email: '',
                relation_revision: 1,
                last_operation_id: operationId,
                active: true,
                deleted: false,
                status: 'active',
                created_at: timestamp,
                updated_at: timestamp,
              })
              transaction.update(orderRef, {
                note: 'Sale sửa đơn legacy',
                invoice_status: 'Không xuất',
                invoice_record_count: 1,
                invoice_relation_revision: 1,
                relation_lock_version: 1,
                relation_last_module: 'invoices',
                relation_last_action: 'create',
                relation_last_document_id: INVOICE_ID,
                relation_updated_by: SALE,
                relation_updated_at: timestamp,
                revision: 1,
                last_operation_id: operationId,
                updated_at: timestamp,
              })
              transaction.update(itemRef, {
                product_name: 'Sản phẩm dữ liệu cũ đã sửa',
                owner_email: '',
                created_by: '',
                sale_email: '',
                order_revision: 1,
                last_operation_id: operationId,
                updated_at: timestamp,
              })
            })
          }

          test('old client reproduces permission-denied by reading missing invoice first', async () => {
            const db = env.authenticatedContext(SALE, { email: SALE }).firestore()
            await assertFails(saveLegacyOrder(db, { readMissingInvoice: true }))
            await env.withSecurityRulesDisabled(async context => {
              assert.equal((await getDoc(doc(context.firestore(), 'invoices', INVOICE_ID))).exists(), false)
            })
          })

          test('fixed client atomically edits order and creates invoice without that read', async () => {
            const db = env.authenticatedContext(SALE, { email: SALE }).firestore()
            await assertSucceeds(saveLegacyOrder(db, { readMissingInvoice: false }))
            const order = (await getDoc(doc(db, 'orders', ORDER_ID))).data()
            const invoice = (await getDoc(doc(db, 'invoices', INVOICE_ID))).data()
            assert.equal(order.revision, 1)
            assert.equal(invoice.order_id, ORDER_ID)
            assert.equal(invoice.created_by, SALE)
          })
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run isolated client regression
        run: node --test tests/order-missing-invoice-read.client.test.mjs

      - name: Run isolated Firestore regression
        run: firebase emulators:exec --only firestore "node --test --test-concurrency=1 tests/order-missing-invoice-transaction.rules.test.mjs"

      - name: Run full Firestore rules suite
        run: npm run test:rules

      - name: Build
        run: npm run build

      - name: Generate static site
        run: npm run generate

      - name: Commit verified client-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-sale-missing-invoice-read.yml
          git rm .github/workflows/fix-sale-missing-invoice-read-v2.yml
          git add composables/useAtomicOrderSave.ts utils/orderAtomicSave.mjs package.json tests/order-missing-invoice-read.client.test.mjs tests/order-missing-invoice-transaction.rules.test.mjs
          git commit -m "fix: bỏ đọc hóa đơn chưa tồn tại khi sửa đơn legacy [skip-isolated-invoice-fix]"
          git push origin HEAD:agent/fix-sale-edit-legacy-orders-v2
