name: Commit verified isolated invoice fix

on:
  push:
    branches:
      - agent/fix-sale-edit-legacy-orders-v2
  pull_request:
    branches:
      - dev

permissions:
  contents: write

jobs:
  commit:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip-commit-invoice-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-sale-edit-legacy-orders-v2
          fetch-depth: 0
      - name: Reapply the verified patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/finalize-isolated-invoice-fix.yml').read_text().splitlines()
          start = lines.index("          python3 - <<'PY'") + 1
          end = lines.index('          PY', start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end]) + '\n'
          Path('/tmp/apply_invoice_fix.py').write_text(script)
          PY
          python3 /tmp/apply_invoice_fix.py
          node --test tests/order-missing-invoice-read.client.test.mjs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/fix-sale-missing-invoice-read.yml
          git rm -f --ignore-unmatch .github/workflows/fix-sale-missing-invoice-read-v2.yml
          git rm -f --ignore-unmatch .github/workflows/rewrite-isolated-invoice-workflow.yml
          git rm -f --ignore-unmatch .github/workflows/finalize-isolated-invoice-fix.yml
          git rm -f --ignore-unmatch .github/workflows/debug-isolated-invoice-test.yml
          git rm -f --ignore-unmatch .github/workflows/run-final-invoice-fix-java21.yml
          git rm -f --ignore-unmatch .github/workflows/commit-verified-invoice-fix.yml
          git add composables/useAtomicOrderSave.ts utils/orderAtomicSave.mjs package.json tests/order-missing-invoice-read.client.test.mjs tests/order-missing-invoice-transaction.rules.test.mjs
          git commit -m "fix: bỏ đọc hóa đơn chưa tồn tại khi sửa đơn legacy [skip-commit-invoice-fix]"
          git push origin HEAD:agent/fix-sale-edit-legacy-orders-v2
