name: Apply warehouse export history

on:
  push:
    branches:
      - agent/warehouse-export-history
    paths:
      - scripts/apply-warehouse-export-history.mjs
      - .github/workflows/apply-warehouse-export-history.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/warehouse-export-history
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Apply source patch
        run: node scripts/apply-warehouse-export-history.mjs

      - name: Run focused client tests
        run: node --test tests/warehouse-export-history.client.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Prepare Nuxt
        run: npx nuxt prepare

      - name: Build
        run: npm run build

      - name: Commit clean feature diff
        run: |
          set -euo pipefail
          rm -f scripts/apply-warehouse-export-history.mjs
          rm -f .github/workflows/apply-warehouse-export-history.yml
          git config user.name "Nguyen Trung Hieu"
          git config user.email "71979577+17020749@users.noreply.github.com"
          git add components/AppShell.vue constants/accessMatrix.mjs package.json pages/warehouse-export-requests.vue pages/warehouse-export-history.vue utils/warehouseExportHistory.mjs tests/warehouse-export-history.client.test.mjs scripts/apply-warehouse-export-history.mjs .github/workflows/apply-warehouse-export-history.yml
          git commit -m "Thêm lịch sử xuất kho và lọc ngày giờ"
          git push origin HEAD:agent/warehouse-export-history
