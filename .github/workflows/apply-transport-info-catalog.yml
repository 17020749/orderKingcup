name: Apply transport information catalog

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/transport-info-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transport-info-catalog
          fetch-depth: 0

      - name: Apply transport catalog changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one anchor, found {count}: {old[:140]!r}')
              file.write_text(source.replace(old, new, 1))

          # Permissions: one page grant and four CRUD grants.
          replace_once(
              'constants/permissions.ts',
              "  { key: 'page.bus_transport', group: 'Vận chuyển nhà xe', name: 'Xem tab Vận chuyển nhà xe' },\n",
              "  { key: 'page.bus_transport', group: 'Vận chuyển nhà xe', name: 'Xem tab Vận chuyển nhà xe' },\n  { key: 'page.transport_carriers', group: 'Danh sách nhà xe', name: 'Xem tab Danh sách nhà xe' },\n",
          )
          replace_once(
              'constants/permissions.ts',
              "  { key: 'bus_transport.delete', group: 'Vận chuyển nhà xe', name: 'Xóa đơn vận chuyển nhà xe' },\n",
              "  { key: 'bus_transport.delete', group: 'Vận chuyển nhà xe', name: 'Xóa đơn vận chuyển nhà xe' },\n\n  { key: 'transport_carriers.view', group: 'Danh sách nhà xe', name: 'Xem danh sách nhà xe' },\n  { key: 'transport_carriers.create', group: 'Danh sách nhà xe', name: 'Thêm nhà xe' },\n  { key: 'transport_carriers.edit', group: 'Danh sách nhà xe', name: 'Sửa nhà xe' },\n  { key: 'transport_carriers.delete', group: 'Danh sách nhà xe', name: 'Xóa nhà xe' },\n",
          )

          # Navigation: create a dedicated grouped section.
          replace_once(
              'constants/accessMatrix.mjs',
              "  { key: 'warehouse', label: 'Kho', order: 20, grouped: true },\n  { key: 'standalone', label: '', order: 30, grouped: false },\n  { key: 'settings', label: 'Cài đặt', order: 40, grouped: true },\n",
              "  { key: 'warehouse', label: 'Kho', order: 20, grouped: true },\n  { key: 'transport', label: 'Thông tin vận chuyển', order: 30, grouped: true },\n  { key: 'standalone', label: '', order: 40, grouped: false },\n  { key: 'settings', label: 'Cài đặt', order: 50, grouped: true },\n",
          )
          replace_once(
              'constants/accessMatrix.mjs',
              "  { key: 'warehouse_settings', path: '/warehouse-settings', label: 'Danh mục kho', permission: 'page.warehouse_settings', navSection: 'warehouse', navOrder: 60 },\n  { key: 'shipments', path: '/shipments', label: 'Vận chuyển', permission: 'page.shipments', navSection: 'warehouse', navOrder: 70 },\n  { key: 'bus_transport', path: '/bus-transport', label: 'Vận chuyển nhà xe', permission: 'page.bus_transport', navSection: 'warehouse', navOrder: 80 },\n\n  { key: 'products',",
              "  { key: 'warehouse_settings', path: '/warehouse-settings', label: 'Danh mục kho', permission: 'page.warehouse_settings', navSection: 'warehouse', navOrder: 60 },\n\n  { key: 'shipments', path: '/shipments', label: 'Vận chuyển', permission: 'page.shipments', navSection: 'transport', navOrder: 10 },\n  { key: 'bus_transport', path: '/bus-transport', label: 'Vận chuyển nhà xe', permission: 'page.bus_transport', navSection: 'transport', navOrder: 20 },\n  { key: 'transport_carriers', path: '/transport-carriers', label: 'Danh sách nhà xe', permission: 'page.transport_carriers', navSection: 'transport', navOrder: 30 },\n\n  { key: 'products',",
          )
          replace_once(
              'constants/accessMatrix.mjs',
              "  'bus_transport.delete': ['page.bus_transport', 'bus_transport.view'],\n\n  'page.invoices':",
              "  'bus_transport.delete': ['page.bus_transport', 'bus_transport.view'],\n\n  'page.transport_carriers': ['transport_carriers.view'],\n  'transport_carriers.view': ['page.transport_carriers'],\n  'transport_carriers.create': ['page.transport_carriers', 'transport_carriers.view'],\n  'transport_carriers.edit': ['page.transport_carriers', 'transport_carriers.view'],\n  'transport_carriers.delete': ['page.transport_carriers', 'transport_carriers.view'],\n\n  'page.invoices':",
          )

          replace_once(
              'components/AppShell.vue',
              "    warehouse_settings: '⚙', shipments: '⌁', products: '◇', printing: '▧', activity_logs: '◷',\n",
              "    warehouse_settings: '⚙', shipments: '⌁', bus_transport: '⇢', transport_carriers: '▰', products: '◇', printing: '▧', activity_logs: '◷',\n",
          )

          # Shared model snapshots.
          replace_once(
              'types/models.ts',
              "export interface ShipmentDoc {\n",
              "export interface TransportCarrierDoc {\n  id: string\n  carrier_code?: string\n  carrier_name: string\n  carrier_phone?: string\n  vehicle_plate?: string\n  driver_name?: string\n  note?: string\n  status?: string\n  active?: boolean\n  deleted?: boolean\n  created_by?: string\n  created_at?: any\n  updated_by?: string\n  updated_at?: any\n  deleted_by?: string\n  deleted_at?: any\n  source?: string\n}\n\nexport interface ShipmentDoc {\n",
          )
          replace_once(
              'types/models.ts',
              "  carrier?: string\n  tracking_code?: string\n",
              "  transport_carrier_id?: string\n  carrier?: string\n  carrier_phone?: string\n  vehicle_plate?: string\n  driver_name?: string\n  tracking_code?: string\n",
          )
          replace_once(
              'types/models.ts',
              "  receiver_address?: string\n  carrier_name?: string\n",
              "  receiver_address?: string\n  transport_carrier_id?: string\n  carrier_name?: string\n",
          )

          # Bus transport now loads and selects catalog records.
          replace_once(
              'pages/bus-transport.vue',
              "import type { BusTransportDoc, ExportRequestDoc } from '~/types/models'\n",
              "import type { BusTransportDoc, ExportRequestDoc, TransportCarrierDoc } from '~/types/models'\n",
          )
          replace_once(
              'pages/bus-transport.vue',
              "const requests = ref<ExportRequestDoc[]>([])\nconst loading = ref(false)\n",
              "const requests = ref<ExportRequestDoc[]>([])\nconst carriers = ref<TransportCarrierDoc[]>([])\nconst loading = ref(false)\n",
          )
          replace_once(
              'pages/bus-transport.vue',
              "const selectedRequest = computed(() => requests.value.find(row => row.id === form.source_request_id) || null)\n",
              "const carrierOptions = computed(() => carriers.value.map(row => ({\n  value: row.id,\n  label: `${row.carrier_name}${row.vehicle_plate ? ` - ${row.vehicle_plate}` : ''}`,\n  subLabel: [row.carrier_phone, row.driver_name].filter(Boolean).join(' · '),\n  search: `${row.carrier_code || ''} ${row.carrier_name || ''} ${row.carrier_phone || ''} ${row.vehicle_plate || ''} ${row.driver_name || ''}`,\n})))\nconst selectedCarrier = computed(() => carriers.value.find(row => row.id === form.transport_carrier_id) || null)\nconst selectedRequest = computed(() => requests.value.find(row => row.id === form.source_request_id) || null)\n",
          )
          replace_once(
              'pages/bus-transport.vue',
              "async function chooseRequest() {\n",
              "function findCarrierSnapshot(row: Partial<BusTransportDoc>) {\n  if (row.transport_carrier_id) return carriers.value.find(item => item.id === row.transport_carrier_id) || null\n  const name = normalizeText(row.carrier_name || '')\n  const plate = normalizeText(row.vehicle_plate || '')\n  return carriers.value.find(item => (\n    name && normalizeText(item.carrier_name) === name\n    && (!plate || normalizeText(item.vehicle_plate || '') === plate)\n  )) || null\n}\n\nfunction chooseCarrier() {\n  const carrier = selectedCarrier.value\n  if (!carrier) return\n  Object.assign(form, {\n    transport_carrier_id: carrier.id,\n    carrier_name: carrier.carrier_name || '',\n    carrier_phone: carrier.carrier_phone || '',\n    vehicle_plate: carrier.vehicle_plate || '',\n    driver_name: carrier.driver_name || '',\n  })\n}\n\nasync function chooseRequest() {\n",
          )
          replace_once(
              'pages/bus-transport.vue',
              "      carrier_name: row.carrier_name || '',\n      carrier_phone: row.carrier_phone || '',\n",
              "      transport_carrier_id: findCarrierSnapshot(row)?.id || row.transport_carrier_id || '',\n      carrier_name: row.carrier_name || '',\n      carrier_phone: row.carrier_phone || '',\n",
          )
          replace_once(
              'pages/bus-transport.vue',
              "       carrier_name: '', carrier_phone: '', vehicle_plate: '', driver_name: '', departure_at: '',\n",
              "       transport_carrier_id: '', carrier_name: '', carrier_phone: '', vehicle_plate: '', driver_name: '', departure_at: '',\n",
          )
          replace_once(
              'pages/bus-transport.vue',
              "  if (!form.source_request_id) return showToast('Vui lòng chọn yêu cầu xuất kho.', 'error')\n",
              "  if (!form.source_request_id) return showToast('Vui lòng chọn yêu cầu xuất kho.', 'error')\n  if (!editing.value && !form.transport_carrier_id) return showToast('Vui lòng chọn nhà xe.', 'error')\n  if (form.transport_carrier_id) chooseCarrier()\n",
          )
          replace_once(
              'pages/bus-transport.vue',
              "         receiver_address: String(form.receiver_address || '').trim(),\n         carrier_name: String(form.carrier_name || '').trim(),\n",
              "         receiver_address: String(form.receiver_address || '').trim(),\n         transport_carrier_id: String(form.transport_carrier_id || '').trim(),\n         carrier_name: String(form.carrier_name || '').trim(),\n",
          )
          replace_once(
              'pages/bus-transport.vue',
              "         receiver_address: form.receiver_address || '',\n         carrier_name: String(form.carrier_name || '').trim(),\n",
              "         receiver_address: form.receiver_address || '',\n         transport_carrier_id: String(form.transport_carrier_id || '').trim(),\n         carrier_name: String(form.carrier_name || '').trim(),\n",
          )
          replace_once(
              'pages/bus-transport.vue',
              "    const [transportSnapshot, requestSnapshot] = await Promise.all([\n      getDocs(collection(db, 'bus_transport_orders')),\n      getDocs(collection(db, 'order_export_requests')),\n    ])\n",
              "    const [transportSnapshot, requestSnapshot, carrierSnapshot] = await Promise.all([\n      getDocs(collection(db, 'bus_transport_orders')),\n      getDocs(collection(db, 'order_export_requests')),\n      getDocs(collection(db, 'transport_carriers')),\n    ])\n",
          )
          replace_once(
              'pages/bus-transport.vue',
              "    requests.value = requestSnapshot.docs.map(item => ({ id: item.id, ...(item.data() || {}) } as ExportRequestDoc)).filter(isActive)\n",
              "    requests.value = requestSnapshot.docs.map(item => ({ id: item.id, ...(item.data() || {}) } as ExportRequestDoc)).filter(isActive)\n    carriers.value = carrierSnapshot.docs\n      .map(item => ({ id: item.id, ...(item.data() || {}) } as TransportCarrierDoc))\n      .filter(isActive)\n      .sort((left, right) => String(left.carrier_name || '').localeCompare(String(right.carrier_name || ''), 'vi'))\n",
          )
          replace_once(
              'pages/bus-transport.vue',
              "        <div class=\"form-group\"><label>Tên nhà xe</label><input v-model=\"form.carrier_name\" class=\"input\" /></div>\n        <div class=\"form-group\"><label>Số điện thoại nhà xe</label><input v-model=\"form.carrier_phone\" class=\"input\" /></div>\n        <div class=\"form-group\"><label>Biển số xe</label><input v-model=\"form.vehicle_plate\" class=\"input\" /></div>\n        <div class=\"form-group\"><label>Tên chủ xe/Tài xế</label><input v-model=\"form.driver_name\" class=\"input\" /></div>\n",
              "        <div class=\"form-group full\"><label>Nhà xe <span class=\"required\">*</span></label><SearchableSelect v-model=\"form.transport_carrier_id\" :options=\"carrierOptions\" placeholder=\"Tìm tên nhà xe, số điện thoại, biển số...\" @change=\"chooseCarrier\" /></div>\n        <div class=\"form-group\"><label>Số điện thoại nhà xe</label><input v-model=\"form.carrier_phone\" class=\"input readonly-field\" readonly /></div>\n        <div class=\"form-group\"><label>Biển số xe</label><input v-model=\"form.vehicle_plate\" class=\"input readonly-field\" readonly /></div>\n        <div class=\"form-group\"><label>Tên chủ xe/Tài xế</label><input v-model=\"form.driver_name\" class=\"input readonly-field\" readonly /></div>\n        <div class=\"form-group\"><label>Tên nhà xe</label><input v-model=\"form.carrier_name\" class=\"input readonly-field\" readonly /></div>\n",
          )

          # Standard shipment page selects the same catalog and keeps snapshots.
          replace_once(
              'pages/shipments.vue',
              "<script setup lang=\"ts\">\nimport type { CustomerDoc, OrderDoc, OrderItemDoc, ShipmentDoc } from '~/types/models'\n",
              "<script setup lang=\"ts\">\nimport { collection, getDocs } from 'firebase/firestore'\nimport type { CustomerDoc, OrderDoc, OrderItemDoc, ShipmentDoc, TransportCarrierDoc } from '~/types/models'\n",
          )
          replace_once(
              'pages/shipments.vue',
              "const { mutateOrderRelation } = useAtomicOrderRelations()\n",
              "const { db } = useFirebaseServices()\nconst { mutateOrderRelation } = useAtomicOrderRelations()\n",
          )
          replace_once(
              'pages/shipments.vue',
              "const customers = ref<CustomerDoc[]>([])\nconst itemsByOrder = ref<Record<string, OrderItemDoc[]>>({})\n",
              "const customers = ref<CustomerDoc[]>([])\nconst transportCarriers = ref<TransportCarrierDoc[]>([])\nconst itemsByOrder = ref<Record<string, OrderItemDoc[]>>({})\n",
          )
          replace_once(
              'pages/shipments.vue',
              "const selectedOrder = computed(() => orders.value.find(order => order.id === form.order_id))\n",
              "const transportCarrierOptions = computed(() => transportCarriers.value.map(row => ({\n  value: row.id,\n  label: `${row.carrier_name}${row.vehicle_plate ? ` - ${row.vehicle_plate}` : ''}`,\n  subLabel: [row.carrier_phone, row.driver_name].filter(Boolean).join(' · '),\n  search: `${row.carrier_code || ''} ${row.carrier_name || ''} ${row.carrier_phone || ''} ${row.vehicle_plate || ''} ${row.driver_name || ''}`,\n})))\nconst selectedTransportCarrier = computed(() => transportCarriers.value.find(row => row.id === form.transport_carrier_id) || null)\nconst selectedOrder = computed(() => orders.value.find(order => order.id === form.order_id))\n",
          )
          replace_once(
              'pages/shipments.vue',
              "  carrier: 'Nhà vận chuyển',\n",
              "  transport_carrier_id: 'ID nhà xe',\n  carrier: 'Nhà vận chuyển',\n  carrier_phone: 'SĐT nhà xe',\n  vehicle_plate: 'Biển số xe',\n  driver_name: 'Chủ xe/Tài xế',\n",
          )
          replace_once(
              'pages/shipments.vue',
              "async function loadRows(force = false, append = false) {\n",
              "function findTransportCarrierSnapshot(row: Partial<ShipmentWithPayerAmounts>) {\n  if (row.transport_carrier_id) return transportCarriers.value.find(item => item.id === row.transport_carrier_id) || null\n  const name = normalizeText(row.carrier || '')\n  const plate = normalizeText(row.vehicle_plate || '')\n  return transportCarriers.value.find(item => (\n    name && normalizeText(item.carrier_name) === name\n    && (!plate || normalizeText(item.vehicle_plate || '') === plate)\n  )) || null\n}\n\nfunction chooseTransportCarrier() {\n  const carrier = selectedTransportCarrier.value\n  if (!carrier) return\n  Object.assign(form, {\n    transport_carrier_id: carrier.id,\n    carrier: carrier.carrier_name || '',\n    carrier_phone: carrier.carrier_phone || '',\n    vehicle_plate: carrier.vehicle_plate || '',\n    driver_name: carrier.driver_name || '',\n  })\n}\n\nasync function loadRows(force = false, append = false) {\n",
          )
          replace_once(
              'pages/shipments.vue',
              "      const [loadedOrders, loadedCustomers] = await Promise.all([\n        loadScopedOrders(force),\n        loadScopedCustomers(force),\n      ])\n",
              "      const [loadedOrders, loadedCustomers, carrierSnapshot] = await Promise.all([\n        loadScopedOrders(force),\n        loadScopedCustomers(force),\n        getDocs(collection(db, 'transport_carriers')),\n      ])\n",
          )
          replace_once(
              'pages/shipments.vue',
              "      customers.value = loadedCustomers.filter(isActive)\n      orders.value = activeOrders.map(order => ({\n",
              "      customers.value = loadedCustomers.filter(isActive)\n      transportCarriers.value = carrierSnapshot.docs\n        .map(item => ({ id: item.id, ...(item.data() || {}) } as TransportCarrierDoc))\n        .filter(isActive)\n        .sort((left, right) => String(left.carrier_name || '').localeCompare(String(right.carrier_name || ''), 'vi'))\n      orders.value = activeOrders.map(order => ({\n",
          )
          replace_once(
              'pages/shipments.vue',
              "       company_shipping_revenue_mode: row.company_shipping_revenue_mode || '',\n     })\n",
              "       company_shipping_revenue_mode: row.company_shipping_revenue_mode || '',\n       transport_carrier_id: findTransportCarrierSnapshot(row)?.id || row.transport_carrier_id || '',\n     })\n",
          )
          replace_once(
              'pages/shipments.vue',
              "       order_code: '',\n       carrier: '',\n       tracking_code: '',\n",
              "       order_code: '',\n       transport_carrier_id: '',\n       carrier: '',\n       carrier_phone: '',\n       vehicle_plate: '',\n       driver_name: '',\n       tracking_code: '',\n",
          )
          replace_once(
              'pages/shipments.vue',
              "  if (!form.order_id) return showToast('Vui lòng chọn đơn hàng.', 'error')\n",
              "  if (!form.order_id) return showToast('Vui lòng chọn đơn hàng.', 'error')\n  if (!editing.value && !form.transport_carrier_id) return showToast('Vui lòng chọn nhà xe.', 'error')\n  if (form.transport_carrier_id) chooseTransportCarrier()\n",
          )
          replace_once(
              'pages/shipments.vue',
              "        <div class=\"form-group\"><label>Nhà vận chuyển</label><input v-model=\"form.carrier\" class=\"input\" /></div>\n        <div class=\"form-group\"><label>Ngày giao</label><input v-model=\"form.shipped_date\" class=\"input\" type=\"date\" /></div>\n",
              "        <div class=\"form-group full\"><label>Nhà xe</label><SearchableSelect v-model=\"form.transport_carrier_id\" :options=\"transportCarrierOptions\" placeholder=\"Tìm tên nhà xe, số điện thoại, biển số...\" @change=\"chooseTransportCarrier\" /></div>\n        <div class=\"form-group\"><label>Số điện thoại nhà xe</label><input v-model=\"form.carrier_phone\" class=\"input readonly-field\" readonly /></div>\n        <div class=\"form-group\"><label>Biển số xe</label><input v-model=\"form.vehicle_plate\" class=\"input readonly-field\" readonly /></div>\n        <div class=\"form-group\"><label>Chủ xe/Tài xế</label><input v-model=\"form.driver_name\" class=\"input readonly-field\" readonly /></div>\n        <div class=\"form-group\"><label>Ngày giao</label><input v-model=\"form.shipped_date\" class=\"input\" type=\"date\" /></div>\n",
          )
          replace_once(
              'pages/shipments.vue',
              "              <td>{{ row.carrier }}</td>\n",
              "              <td><b>{{ row.carrier || '-' }}</b><div class=\"small subtle\">{{ [row.vehicle_plate, row.carrier_phone].filter(Boolean).join(' · ') }}</div></td>\n",
          )

          # Rules for an isolated catalog. Existing shipment/bus permissions may read it for selection.
          replace_once(
              'firestore.rules',
              "    match /bus_transport_orders/{docId} {\n",
              "    match /transport_carriers/{docId} {\n      allow read: if hasAnyPerm([\n        'transport_carriers.view',\n        'shipments.view', 'shipments.view_all', 'shipments.create', 'shipments.edit',\n        'bus_transport.view', 'bus_transport.create', 'bus_transport.edit'\n      ]);\n\n      allow create: if hasPerm('transport_carriers.create')\n        && request.resource.data.get('id', '') == docId\n        && validBoundedString(request.resource.data.get('carrier_code', ''), 1, 100)\n        && validBoundedString(request.resource.data.get('carrier_name', ''), 1, 200)\n        && request.resource.data.get('active', false) == true\n        && request.resource.data.get('deleted', true) == false\n        && request.resource.data.get('created_at', null) == request.time\n        && request.resource.data.get('updated_at', null) == request.time\n        && ownEmailField(request.resource.data, 'created_by')\n        && ownEmailField(request.resource.data, 'updated_by');\n\n      allow update: if isAdmin()\n        || (\n          hasPerm('transport_carriers.edit')\n          && unchanged(['id', 'carrier_code', 'created_at', 'created_by', 'deleted', 'active', 'status', 'deleted_at', 'deleted_by'])\n          && request.resource.data.get('updated_at', null) == request.time\n          && ownEmailField(request.resource.data, 'updated_by')\n        )\n        || (\n          hasPerm('transport_carriers.delete')\n          && onlyChanged(['deleted', 'active', 'status', 'deleted_at', 'deleted_by', 'updated_at', 'updated_by'])\n          && request.resource.data.get('deleted', false) == true\n          && request.resource.data.get('active', true) == false\n          && request.resource.data.get('status', '') == 'deleted'\n          && request.resource.data.get('deleted_at', null) == request.time\n          && request.resource.data.get('updated_at', null) == request.time\n          && ownEmailField(request.resource.data, 'deleted_by')\n          && ownEmailField(request.resource.data, 'updated_by')\n        );\n\n      allow delete: if isAdmin();\n    }\n\n    match /bus_transport_orders/{docId} {\n",
          )

          # New simple CRUD page.
          Path('pages/transport-carriers.vue').write_text('''<script setup lang="ts">
import { collection, doc, getDocs, serverTimestamp, setDoc, updateDoc } from 'firebase/firestore'
import type { TransportCarrierDoc } from '~/types/models'
import { formatDateTime, isActive, makeCode, makeId, normalizeText } from '~/utils/format'
import { reportFirebaseError } from '~/utils/firebaseErrors'

const { db } = useFirebaseServices()
const { appUser, hasPermission } = useAuth()
const { showToast, withLoading } = useUi()
const { confirmState, askConfirm, resolveConfirm } = useConfirmDialog()
const { invalidateScopedCache } = useRepo()

const rows = ref<TransportCarrierDoc[]>([])
const loading = ref(false)
const saving = ref(false)
const search = ref('')
const showModal = ref(false)
const showDetailModal = ref(false)
const editing = ref<TransportCarrierDoc | null>(null)
const selectedDetail = ref<TransportCarrierDoc | null>(null)
const form = reactive<any>({})

const canView = computed(() => hasPermission('*') || hasPermission('transport_carriers.view'))
const canCreate = computed(() => hasPermission('*') || hasPermission('transport_carriers.create'))
const canEdit = computed(() => hasPermission('*') || hasPermission('transport_carriers.edit'))
const canDelete = computed(() => hasPermission('*') || hasPermission('transport_carriers.delete'))

const filtered = computed(() => {
  const keyword = normalizeText(search.value)
  if (!keyword) return rows.value
  return rows.value.filter(row => normalizeText([
    row.carrier_code,
    row.carrier_name,
    row.carrier_phone,
    row.vehicle_plate,
    row.driver_name,
    row.note,
  ].join(' ')).includes(keyword))
})

function resetForm(row?: TransportCarrierDoc) {
  Object.keys(form).forEach(key => delete form[key])
  Object.assign(form, {
    carrier_name: row?.carrier_name || '',
    carrier_phone: row?.carrier_phone || '',
    vehicle_plate: row?.vehicle_plate || '',
    driver_name: row?.driver_name || '',
    note: row?.note || '',
  })
}

function openModal(row?: TransportCarrierDoc) {
  if (row && !canEdit.value) return showToast('Bạn không có quyền sửa nhà xe.', 'error')
  if (!row && !canCreate.value) return showToast('Bạn không có quyền thêm nhà xe.', 'error')
  editing.value = row || null
  resetForm(row)
  showModal.value = true
}

function openDetail(row: TransportCarrierDoc) {
  selectedDetail.value = row
  showDetailModal.value = true
}

async function save() {
  const name = String(form.carrier_name || '').trim()
  const phone = String(form.carrier_phone || '').trim()
  const plate = String(form.vehicle_plate || '').trim().toUpperCase()
  const driver = String(form.driver_name || '').trim()
  if (!name) return showToast('Vui lòng nhập tên nhà xe.', 'error')
  if (!plate) return showToast('Vui lòng nhập biển số xe.', 'error')
  const duplicated = rows.value.some(row => row.id !== editing.value?.id && normalizeText(row.vehicle_plate || '') === normalizeText(plate))
  if (duplicated) return showToast('Biển số xe này đã tồn tại.', 'error')

  saving.value = true
  await withLoading(async () => {
    const actor = appUser.value?.email || ''
    if (editing.value) {
      await updateDoc(doc(db, 'transport_carriers', editing.value.id), {
        carrier_name: name,
        carrier_phone: phone,
        vehicle_plate: plate,
        driver_name: driver,
        note: String(form.note || '').trim(),
        updated_by: actor,
        updated_at: serverTimestamp(),
      })
      showToast('Đã cập nhật nhà xe.', 'success')
    } else {
      const id = makeId('carrier')
      await setDoc(doc(db, 'transport_carriers', id), {
        id,
        carrier_code: makeCode('NX'),
        carrier_name: name,
        carrier_phone: phone,
        vehicle_plate: plate,
        driver_name: driver,
        note: String(form.note || '').trim(),
        status: 'active',
        active: true,
        deleted: false,
        created_by: actor,
        created_at: serverTimestamp(),
        updated_by: actor,
        updated_at: serverTimestamp(),
        source: 'nuxt',
      })
      showToast('Đã thêm nhà xe.', 'success')
    }
    invalidateScopedCache('transport_carriers')
    showModal.value = false
    await loadRows()
  }).catch(error => showToast(reportFirebaseError(error, 'Không lưu được nhà xe.'), 'error'))
    .finally(() => { saving.value = false })
}

async function remove(row: TransportCarrierDoc) {
  if (!canDelete.value) return showToast('Bạn không có quyền xóa nhà xe.', 'error')
  const confirmed = await askConfirm({
    title: 'Xóa nhà xe',
    message: `Bạn chắc chắn muốn xóa ${row.carrier_name || row.id}? Dữ liệu vận chuyển cũ vẫn giữ snapshot nhà xe.`,
    confirmLabel: 'Xóa nhà xe',
  })
  if (!confirmed) return
  const actor = appUser.value?.email || ''
  await withLoading(async () => {
    await updateDoc(doc(db, 'transport_carriers', row.id), {
      deleted: true,
      active: false,
      status: 'deleted',
      deleted_by: actor,
      deleted_at: serverTimestamp(),
      updated_by: actor,
      updated_at: serverTimestamp(),
    })
    rows.value = rows.value.filter(item => item.id !== row.id)
    invalidateScopedCache('transport_carriers')
    showToast('Đã xóa nhà xe.', 'success')
  }).catch(error => showToast(reportFirebaseError(error, 'Không xóa được nhà xe.'), 'error'))
}

async function loadRows(force = false) {
  if (!canView.value) return
  loading.value = true
  try {
    const snapshot = await getDocs(collection(db, 'transport_carriers'))
    rows.value = snapshot.docs
      .map(item => ({ id: item.id, ...(item.data() || {}) } as TransportCarrierDoc))
      .filter(isActive)
      .sort((left, right) => String(left.carrier_name || '').localeCompare(String(right.carrier_name || ''), 'vi'))
    if (force) showToast('Đã làm mới danh sách nhà xe.', 'success')
  } catch (error) {
    showToast(reportFirebaseError(error, 'Không tải được danh sách nhà xe.'), 'error')
  } finally {
    loading.value = false
  }
}

onMounted(() => loadRows())
</script>

