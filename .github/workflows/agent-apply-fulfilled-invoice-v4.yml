name: Agent apply fulfilled invoice edit v4

on:
  push:
    branches:
      - agent/fulfilled-order-invoice-edit

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.invalid
      NUXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder
      NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      NUXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
      NUXT_PUBLIC_APP_NAME: KINGCUP CI

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fulfilled-order-invoice-edit
          fetch-depth: 0

      - name: Verify patch payload
        shell: bash
        run: |
          echo '941d0070b5f5e734d45a3d6538585b7ffe0565fd23b6c6245fc2fb237f362ca5  .github/agent-fulfilled-invoice-v2.part1' | sha256sum --check
          echo 'd8adaaa628a7c1aed6f0509bb27efa411f8be98787ef882087e51bc6ed88f28b  .github/agent-fulfilled-invoice-v2.part2' | sha256sum --check
          echo '9ef6709e808a3b02fd73b655dde5085b637ce03ce193186ec58163b85557104a  .github/agent-fulfilled-invoice-v2.part3a' | sha256sum --check
          echo 'abb32f6b83e3b62bd0279925f113adc12c92c49be7d09b2975b698efa275d227  .github/agent-fulfilled-invoice-v2.part3b' | sha256sum --check
          echo '6dc05e5e5ee6af528e9c1e16fc2794280ac37449777ebcdea3bb682eb99f364b  .github/agent-fulfilled-invoice-v2.part3c' | sha256sum --check
          echo '36f450a480681d05d92be970a107b80088dfba201c024ccb26df55f2df977f5c  .github/agent-fulfilled-invoice-v2.part4' | sha256sum --check
          cat .github/agent-fulfilled-invoice-v2.part1 .github/agent-fulfilled-invoice-v2.part2 .github/agent-fulfilled-invoice-v2.part3a .github/agent-fulfilled-invoice-v2.part3b .github/agent-fulfilled-invoice-v2.part3c .github/agent-fulfilled-invoice-v2.part4 > /tmp/apply-fulfilled-invoice.py.gz.b64
          echo 'af247ca73e15a4049f97e59a4f7482e9ab5f2ffa21cf4bfe9f9cf95a145b7bee  /tmp/apply-fulfilled-invoice.py.gz.b64' | sha256sum --check
          base64 -d /tmp/apply-fulfilled-invoice.py.gz.b64 | gzip -d > /tmp/apply-fulfilled-invoice.py
          python -m py_compile /tmp/apply-fulfilled-invoice.py

      - name: Apply scoped patch
        run: python /tmp/apply-fulfilled-invoice.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.2 --no-audit --no-fund

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prepare Nuxt
        run: npx --no-install nuxi prepare

      - name: Client regression tests
        run: node --test tests/order-fulfilled-metadata-edit.client.test.mjs

      - name: Firestore rules tests
        run: npm run test:rules

      - name: Build
        run: npm run build

      - name: Commit implementation and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-apply-fulfilled-invoice.yml .github/workflows/agent-apply-fulfilled-invoice-v2.yml .github/workflows/agent-apply-fulfilled-invoice-v3.yml .github/workflows/agent-apply-fulfilled-invoice-v4.yml .github/workflows/agent-diagnose-fulfilled-invoice-payload.yml .github/agent-apply-fulfilled-invoice.py.gz.b64 .github/agent-fulfilled-invoice.part1 .github/agent-fulfilled-invoice.part2 .github/agent-fulfilled-invoice.part3 .github/agent-fulfilled-invoice.part4 .github/agent-fulfilled-invoice-v2.part1 .github/agent-fulfilled-invoice-v2.part2 .github/agent-fulfilled-invoice-v2.part3 .github/agent-fulfilled-invoice-v2.part4 .github/agent-fulfilled-invoice-v2.part3a .github/agent-fulfilled-invoice-v2.part3b .github/agent-fulfilled-invoice-v2.part3c
          git add pages/orders.vue composables/useFulfilledOrderMetadataSave.ts utils/orderFulfilledMetadataEdit.mjs firestore.rules tests/order-fulfilled-metadata-edit.client.test.mjs tests/order-export-delete-lock.rules.test.mjs
          git diff --cached --check
          git commit -m "feat: allow invoice status edit on fulfilled orders"
          git push origin HEAD:agent/fulfilled-order-invoice-edit
