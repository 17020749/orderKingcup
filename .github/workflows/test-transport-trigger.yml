name: Test transport branch trigger

on:
  push:
    branches:
      - agent/transport-info-catalog
    paths:
      - .github/workflows/test-transport-trigger.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transport-info-catalog
      - run: echo triggered-v2 > TRANSPORT_TRIGGERED.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TRANSPORT_TRIGGERED.txt
          git commit -m "Confirm transport workflow trigger"
          git push origin HEAD:agent/transport-info-catalog
